name: "P6 GHA: Deploys a NextJS Static Site to S3"
description: "P6 GHA: Deploys a NextJS Static Site to S3"
author: "Philip M. Gollucci"
inputs:
  aws_region:
    description: "AWS region for deployment"
    required: false
    default: "us-east-1"
  aws_role:
    description: "AWS role to assume"
    required: true
  aws_session_name:
    description: "Session name for the AWS role"
    required: true
  cdk_deploy_account:
    # Deprecated and unused: this action never reads cdk_deploy_account. It is
    # kept declared, and downgraded to optional, only so existing callers that
    # still pass it do not start emitting "Unexpected input(s)" warnings.
    # Remove it once pgollucci/gollucci.com and p6m7g8/p6m7g8.com have dropped
    # it from their deploy workflows.
    description: "Deprecated, unused. AWS CDK deploy account. Retained for caller compatibility."
    required: false
    deprecationMessage: "cdk_deploy_account is unused by next-deploy and will be removed. Stop passing it."
  cdk_deploy_region:
    description: "AWS CDK deploy region"
    required: true
  bucket_name:
    description: "S3 bucket name"
    required: true
  cloudfront_distribution_id:
    description: "CloudFront distribution ID"
    required: true
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: p6m7g8-actions/gh-repo-checkout@main
    - name: Node
      uses: p6m7g8-actions/p6-node-setup@main
    - name: Disable Next.js Telemetry
      shell: bash
      run: echo "NEXT_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
    - name: Run build
      shell: bash
      run: pnpm run build
    - name: Assume role using OIDC
      uses: p6m7g8-actions/p6-aws-setup@main
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_role }}
        role-session-name: ${{ inputs.aws_session_name }}
    - name: Deploy to S3
      shell: bash
      env:
        BUCKET_NAME: ${{ inputs.bucket_name }}
        DEPLOY_REGION: ${{ inputs.cdk_deploy_region }}
      run: |
        aws s3 sync out "s3://${BUCKET_NAME}" \
          --no-progress --follow-symlinks --delete --region "${DEPLOY_REGION}"
    - name: Invalidate CloudFront cache
      uses: chetan/invalidate-cloudfront-action@v2.4.2
      env:
        AWS_REGION: ${{ inputs.cdk_deploy_region }}
        DISTRIBUTION: ${{ inputs.cloudfront_distribution_id }}
        PATHS: "/*"
